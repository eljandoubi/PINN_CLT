[project]
name = "pinn-clt"
version = "0.1.0"
description = "Physics-Informed Neural Network for Classical Lamination Theory (orthotropic plate bending)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "imageio>=2.37.3",
    "imageio-ffmpeg>=0.6.0",
    "matplotlib>=3.10.9",
    "pillow>=12.2.0",
    "python-dotenv>=1.2.2",
    "simple-parsing>=0.1.8",
    "torch>=2.11.0",
    "tqdm>=4.67.3",
    "wandb>=0.26.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
# Formatter (not E501) owns line length; long comments/docstrings are fine.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The L-BFGS closure is invoked synchronously within the same loop iteration
# it is defined in, so the "late-binding loop variable" warning is a false
# positive here.
"train.py" = ["B023"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks slow-running tests (e.g. end-to-end training smoke tests)",
]
filterwarnings = [
    "ignore::DeprecationWarning:wandb.*",
]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*"]

[tool.coverage.report]
precision = 1
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
